# MAPS scenario 2025 with levels computed by phase 1 (decision D16) on the GSSI services file;
# Minimum of the D3.3.2 cost function at the price from the GSSI unions, all parameters free:
# time 31 minutes, any shared border, level 4 may also merge into level 3.
# Otherwise identical to maps-2025.yaml (D3.2.1 appendix A1; decisions D5, D13, D14, D15, D17).
name: maps-2025-d16-cost-free
reference_year: 2025
levels: [1, 2, 3, 4, 5, 6]
phase2_pairs:
  2: [1]
  3: [1]
  4: [1, 2, 3]
  5: [1, 2, 3]
  6: [1, 2, 3]
phase4_levels: [4, 5, 6]
contiguity:
  min_shared_share: 0.0
  max_minutes: 31
distant_minutes: 60
id_order: numeric
max_chain_length: 16
inputs:
  units: ../data/units-2025-d16.parquet
  # GSSI contiguity matrix (2021 boundaries) aggregated to the 2025 municipalities by
  # maps/prepare/reconduct_contiguity.py
  contiguity: ../data/contiguity-2025-reconducted.parquet
  travel_times:
    path: ../data/times-2025.parquet
    description: >-
      ISTAT travel-time matrix on TomTom graph, free-flow minutes (ttp_tot), 2021 boundaries
      reconducted to 2025 (decision D10); GSSI zip of 16/10/2026
