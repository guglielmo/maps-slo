# Calibration grid of the aggregation (D3.3.2, calibration method draft, paragraph
# "Parametri e intervalli proposti"). The base scenario gives everything else.
base_scenario: ../scenarios/maps-2025-d16-hospital.yaml
corrections: ../reference/corrections.csv

# relevant contiguity (decision D15): both thresholds are strict and act on phases 2 and 4
min_shared_share: {from: 0.0, to: 0.10, step: 0.005}
max_minutes: [10, 15, 20, 25, 30, 35, 40]

# which levels can merge into which in phase 2 (decisions D5, D14)
phase2_pairs:
  current: {2: [1], 3: [1], 4: [1, 2], 5: [1, 2, 3], 6: [1, 2, 3]}
  only_level_1: {2: [1], 3: [1], 4: [1], 5: [1], 6: [1]}
  level_4_into_3: {2: [1], 3: [1], 4: [1, 2, 3], 5: [1, 2, 3], 6: [1, 2, 3]}

# measures (paragraph "Misure")
far_minutes: [20, 30]          # K3: population beyond these minutes from the main centre
service_levels: [1, 2, 3]      # K5: main centre of one of these levels
small_system_weight: 10000     # K6
